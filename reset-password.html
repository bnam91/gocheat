<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ★★주소창에 «살아 있는 재설정 토큰»이 들어 있는 유일한 페이지다.
       Referer 로 그 URL 이 통째로 나가면(폰트 CDN 요청·바깥 링크 클릭) 토큰이 남의 로그에 남는다.
       그래서 이 페이지만 no-referrer 다. 아래 스크립트가 주소창에서도 토큰을 지운다. -->
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0B0B0E" />
  <script>(function(){try{var t=localStorage.getItem('sms_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>새 비밀번호 설정 · 소문의섬</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20260904a" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=20260904a" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo"><img class="logo-mark" src="/assets/logo-mark.png?v=20260904a" alt="" width="22" height="22" /><span>소문의섬</span></a>
      <div class="nav-links">
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
        <button type="button" class="theme-toggle" aria-label="테마 전환">
          <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
        </button>
      </div>
    </nav>
  </header>
  <section class="auth">
    <h1 class="auth-title">새 비밀번호 설정</h1>
    <div class="auth-card">
      <form id="pw-form" class="signup-form" novalidate>
        <label class="signup-label" for="password">새 비밀번호 <span class="lbl-hint">(8자 이상)</span></label>
        <input id="password" type="password" class="signup-input" placeholder="••••••••"
               autocomplete="new-password" minlength="8" required />
        <label class="signup-label" for="password2">새 비밀번호 확인</label>
        <input id="password2" type="password" class="signup-input" placeholder="••••••••"
               autocomplete="new-password" minlength="8" required />
        <button type="submit" class="signup-submit" id="pw-submit">비밀번호 변경</button>
        <p class="signup-msg" id="pw-msg" role="status" aria-live="polite"></p>
      </form>
      <p class="signup-hint" id="pw-hint">
        이 링크는 <b>30분 동안, 한 번만</b> 쓸 수 있어요.<br />
        비밀번호를 바꾸면 <b>앱·확장 프로그램의 로그인이 모두 풀립니다</b> — 보안을 위한 것이니 다시 로그인해 주세요.
      </p>
      <div class="find-result" id="pw-done" hidden>
        <p class="find-result-label">완료</p>
        <p class="find-result-value">비밀번호가 바뀌었어요</p>
        <p class="find-result-note">보안을 위해 앱·확장 프로그램에서는 <b>다시 로그인</b>해 주세요.</p>
        <a href="login.html" class="plan-cta" style="display:block;text-decoration:none;margin-top:14px">로그인하러 가기 →</a>
      </div>
      <p class="find-manual" id="pw-bad" hidden>
        <span id="pw-bad-text">링크가 올바르지 않아요.</span><br />
        <a href="find-password.html">비밀번호 찾기를 다시 하기 →</a>
      </p>
    </div>
    <p class="auth-links">
      <a href="login.html">로그인</a>
      <span class="sep">|</span>
      <a href="find-email.html">이메일 찾기</a>
      <span class="sep">|</span>
      <a href="signup.html">회원가입</a>
    </p>
  </section>
  <footer>
    <div class="footer-inner">
      <div class="footer-links">
        <a href="terms.html">이용약관</a>
        <a href="privacy.html">개인정보 처리방침</a>
      </div>
      <div id="biz-info"></div>
      <p class="footer-meta"><span id="footer-copy"></span><span class="footer-email">coq3820@gmail.com</span></p>
    </div>
  </footer>

  <script>
    (function () {
      var form = document.getElementById("pw-form");
      var msg = document.getElementById("pw-msg");
      var hint = document.getElementById("pw-hint");
      var done = document.getElementById("pw-done");
      var bad = document.getElementById("pw-bad");
      var badText = document.getElementById("pw-bad-text");
      var btn = document.getElementById("pw-submit");
      var pw1 = document.getElementById("password");
      var pw2 = document.getElementById("password2");

      // ★★토큰을 «읽자마자» 주소창에서 지운다.
      //   그대로 두면 뒤로가기 기록·북마크·화면공유·어깨너머에 살아 있는 계정탈취 링크가 남는다.
      //   변수로는 이미 들고 있으므로 지워도 이 페이지의 동작에는 영향이 없다.
      var token = "";
      try {
        token = (new URLSearchParams(location.search).get("token") || "").trim().toLowerCase();
      } catch (e) { token = ""; }
      try { history.replaceState({}, "", location.pathname); } catch (e) { /* 구형 브라우저 — 동작엔 지장 없다 */ }

      function say(t, ok) { msg.textContent = t; msg.className = "signup-msg " + (ok ? "signup-msg-ok" : "signup-msg-error"); }
      function fail(t) {
        badText.textContent = t;
        bad.hidden = false;
        form.style.display = "none";
        hint.hidden = true;
      }

      // ★서버 오류코드를 그대로 붙이면 「실패했어요: weak_password」가 뜬다.
      //   아는 건 번역하고, 모르는 건 «코드를 숨기고» 사람 말로 폴백한다. (signup.html 과 같은 규칙)
      var ERRORS = {
        invalid_token:  "링크가 올바르지 않아요. 비밀번호 찾기를 다시 해 주세요.",
        expired_token:  "링크가 만료됐어요(30분). 비밀번호 찾기를 다시 해 주세요.",
        weak_password:  "비밀번호는 8자 이상이어야 해요.",
        invalid_body:   "요청을 읽지 못했어요. 새로고침한 뒤 다시 시도해 주세요.",
        internal_error: "서버 오류예요. 잠시 후 다시 시도해 주세요."
      };

      // ★토큰 «형식»은 여기서 미리 거른다 — 서버와 같은 규칙(64 hex)이다.
      //   서버에 물어봐야만 알 수 있는 것이 아니므로, 빈 폼을 보여주고 다 입력하게 한 뒤
      //   「링크가 틀렸다」고 하는 것은 사용자 시간을 낭비시키는 일이다.
      if (!/^[a-f0-9]{64}$/.test(token)) {
        fail(ERRORS.invalid_token);
        return;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var p1 = pw1.value || "";
        var p2 = pw2.value || "";
        // 문구는 signup.html 의 것을 «그대로» 쓴다 — 두 화면이 다른 말을 하면 안 된다.
        if (p1.length < 8) { pw1.focus(); return say("비밀번호는 8자 이상이어야 해요.", false); }
        if (p1 !== p2) { pw2.focus(); return say("비밀번호가 서로 달라요.", false); }
        btn.disabled = true; var o = btn.textContent; btn.textContent = "처리 중…"; say("", true);
        try {
          var r = await fetch("/api/license/reset-confirm", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, password: p1 })
          });
          var j = await r.json().catch(function () { return {}; });
          if (r.status === 200 && j.ok) {
            done.hidden = false; form.style.display = "none"; hint.hidden = true;
            return;
          }
          // 토큰이 죽은 경우는 폼을 다시 채우게 두지 않는다 — 몇 번을 눌러도 결과가 같다.
          if (j.reason === "invalid_token" || j.reason === "expired_token") {
            return fail(ERRORS[j.reason]);
          }
          // ⛔`'실패했어요: ' + j.error` 같은 형태를 쓰지 마라 — 날 코드가 화면에 뜬다.
          say(ERRORS[j.reason] || ERRORS[j.error] || "변경하지 못했어요. 잠시 후 다시 시도해 주세요.", false);
        } catch (err) {
          say("네트워크 오류예요. 잠시 후 다시 시도해 주세요.", false);
        } finally { btn.disabled = false; btn.textContent = o; }
      });
    })();
  </script>
  <script src="footer.js?v=20260904a"></script>
  <script src="nav-auth.js?v=20260904a"></script>
  <script src="theme.js?v=20260904a"></script>
</body>
</html>
