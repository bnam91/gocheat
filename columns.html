<!DOCTYPE html>

  <meta charset="UTF-8" />

  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0B0B0E" />
  <script>(function(){try{var t=localStorage.getItem('sms_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>칼럼 · 소문의섬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ★columns.html 전용 스코프 — 공유 style.css 무접촉. 「준비 중」 빈 상태만 담는다(글은 지어내지 않음). -->
  <style>
    .col-empty {
      max-width: var(--read); margin: 0 auto; padding: 0 24px clamp(96px, 12vw, 160px);
      display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
    }
    .col-empty-card {
      width: 100%; border: 1px dashed var(--border-strong); border-radius: var(--radius);
      background: var(--bg-elev); padding: 44px 28px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .col-empty-badge { font-family: var(--mono); font-size: var(--fs-xs); color: var(--subtle); letter-spacing: 0.04em; }
    .col-empty-title { font-size: var(--fs-h3); font-weight: 700; letter-spacing: -0.02em; color: var(--fg); }
    .col-empty-desc { font-size: var(--fs-body); color: var(--muted); line-height: 1.7; text-wrap: balance; max-width: 46ch; }
    .col-empty-cta { margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">소문의섬</a>
      <div class="nav-links">

        <a href="columns.html">칼럼</a>

        <a href="https://www.youtube.com/@소문의섬" target="_blank" rel="noopener">YouTube</a>
        <button type="button" class="theme-toggle" aria-label="테마 전환">
          <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
        </button>
      </div>
    </nav>
  </header>

  <section class="detail" id="overview">
    <div class="detail-inner">
      <div class="detail-meta">
        <h1 class="detail-title">칼럼</h1>
        <p class="detail-lead">쇼핑몰·셀러·1인 사업가를 위한 기록과 생각을 이곳에 씁니다.</p>
      </div>
    </div>
  </section>

  <section class="col-empty" aria-label="칼럼 준비 중">
    <div class="col-empty-card">
      <p class="col-empty-badge">준비 중</p>
      <p class="col-empty-title">첫 글을 준비하고 있습니다.</p>
      <p class="col-empty-desc">아직 올라온 칼럼이 없습니다. 곧 첫 글로 찾아뵙겠습니다.
        그동안 도구와 영상은 메인에서 볼 수 있어요.</p>
      <a class="cta-primary col-empty-cta" href="/#apps">도구 보러 가기 →</a>
    </div>
