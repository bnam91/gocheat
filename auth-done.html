<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0B0B0E" />
  <meta name="robots" content="noindex" />
  <script>(function(){try{var t=localStorage.getItem('sms_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>로그인 중… · 소문의섬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="style.css?v=20260906a" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20260905m" />
</head>
<body>
  <!-- ★★이 페이지는 «스쳐 지나가는» 곳이다(보통 0.3초).
       하는 일 = 콜백이 건넨 일회용 쿠키를 sessionStorage 의 sms_token 으로 «옮겨 담고» 목적지로 보낸다.
       그래야 구글 로그인이 기존 이메일 로그인과 «완전히 같은 상태»를 만든다(nav-auth.js 가 그 키를 본다).
       ⛔여기에 다른 기능을 붙이지 마라. 오래 머무는 페이지가 아니다. -->
  <section class="auth">
    <div class="auth-inner">
      <h1 class="auth-title" id="ad-title">로그인 중…</h1>
      <p class="auth-sub" id="ad-msg">잠시만 기다려 주세요.</p>
      <p class="signup-msg" id="ad-fallback" hidden>
        <a href="login.html" class="signup-submit" style="display:inline-block">로그인 화면으로</a>
      </p>
    </div>
  </section>

  <script>
  (function () {
    'use strict';
    var msg = document.getElementById('ad-msg');
    var title = document.getElementById('ad-title');

    function bail(text) {
      title.textContent = '로그인을 마치지 못했어요';
      msg.textContent = text;
      document.getElementById('ad-fallback').hidden = false;
    }

    /* ★목적지는 «경로»만 받는다. //evil.com 같은 값이면 홈으로 떨어뜨린다
       (서버가 이미 걸렀지만, 이 페이지도 스스로 확인한다 — 검사는 «양쪽»에 있어야 한다). */
    function safeNext() {
      var n = new URLSearchParams(location.search).get('next') || '/';
      if (n.charAt(0) !== '/' || n.charAt(1) === '/') return '/';
      return n;
    }

    fetch('/api/license/session-adopt', {
      method: 'POST',
      credentials: 'same-origin',   // ★쿠키를 실어 보낸다 — 이게 없으면 쿠키가 안 간다
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        if (!d || !d.ok || !d.sessionToken) {
          bail('로그인 정보가 만료되었어요. 다시 시도해 주세요.');
          return;
        }
        /* ★login-page.js 가 채우는 키와 «똑같이» 채운다.
           하나라도 빠지면 「로그인은 됐는데 등급이 안 보이는」 식으로 화면이 갈린다. */
        try {
          sessionStorage.setItem('sms_email', d.email || '');
          sessionStorage.setItem('sms_token', d.sessionToken);
          if (d.plan) sessionStorage.setItem('sms_plan', d.plan);
          else sessionStorage.removeItem('sms_plan');
          if (d.accessUntil) sessionStorage.setItem('sms_until', d.accessUntil);
          else sessionStorage.removeItem('sms_until');
        } catch (e) {
          // 사파리 프라이빗 등에서 storage 가 막힐 수 있다 — 그래도 이동은 시킨다.
        }
        window.location.replace(safeNext());
      })
      .catch(function () { bail('네트워크 오류입니다. 다시 시도해 주세요.'); });
  })();
  </script>
  <script src="theme.js?v=20260905m"></script>
</body>
</html>
