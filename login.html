<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0B0B0E" />
  <script>(function(){try{var t=localStorage.getItem('sms_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>로그인 · 소문의섬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="style.css?v=20260904e" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20260904e" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=20260904e" />
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo"><img class="logo-mark" src="/assets/logo-mark.png?v=20260904e" alt="" width="22" height="22" /><span>소문의섬</span></a>
      <div class="nav-links">
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
        <button type="button" class="theme-toggle" aria-label="테마 전환">
          <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
        </button>
      </div>
    </nav>
  </header>

  <section class="auth">
    <img src="/assets/icons/goditor.png" alt="" class="auth-mark" id="lg-mark" width="52" height="52" hidden />
    <!-- ★기본 문구 제거(현빈 2026-09-01). 요소는 «남긴다» — 주문/다운로드에서 넘어오면
         JS 가 「GODITOR 로그인」처럼 채운다. hidden 이라 채울 말이 없으면 «안 보인다». -->
    <p class="section-label" id="lg-label" hidden></p>
    <h1 class="auth-title" id="login-title">로그인</h1>
    <!-- ★기본 문구 제거(현빈 2026-09-01). ⛔요소는 «지우지 않는다» —
         로그인 후 안내(주문 복귀·다운로드 이동·요금제)에서 sub.textContent 를 4곳이 쓴다.
         지우면 null 참조로 그 흐름이 통째로 끊긴다(이 파일 UL-005 주석의 사고와 같은 형태). -->
    <p class="auth-sub" id="login-sub"></p>

    <div class="auth-card">
      <form id="login-form" class="signup-form" novalidate>
        <label class="signup-label" for="email">이메일</label>
        <input id="email" name="email" type="email" class="signup-input"
               placeholder="you@example.com" autocomplete="email" required />

        <label class="signup-label" for="password">비밀번호</label>
        <input id="password" name="password" type="password" class="signup-input"
               placeholder="••••••••" autocomplete="current-password" required />

        <button type="submit" class="signup-submit" id="login-submit">로그인</button>
        <p class="signup-msg" id="login-msg" role="status" aria-live="polite"></p>
      </form>

      <!-- 로그인 성공 후 상태 패널 -->
      <div class="account-panel" id="account-panel">
        <div class="account-rows">
          <div class="account-row"><span class="account-key">계정</span><span class="account-val" id="acc-email">—</span></div>
          <div class="account-row"><span class="account-key">이용 등급</span><span class="account-val account-val-accent" id="acc-plan">—</span></div>
          <div class="account-row"><span class="account-key">이용 기한</span><span class="account-val" id="acc-until">—</span></div>
        </div>
        <a id="go-app" class="plan-cta" style="display:block;text-decoration:none;max-width:260px;" href="/#hero-apps">앱 목록으로 →</a>
          <a id="go-mypage" class="plan-cta plan-cta-quiet" style="display:block;text-decoration:none;text-align:center;max-width:260px;margin-top:8px" href="mypage.html">마이페이지 →</a>
        <p class="order-warn" id="acc-note">같은 이메일·비밀번호로 앱에서도 로그인하실 수 있어요.</p>
        <button type="button" class="plan-cta plan-cta-quiet" id="logout-btn" style="max-width:200px;">다른 계정으로 로그인</button>
      </div>
    </div>

    <!-- ★카드 밖 한 줄. 네이버가 심플해 보이는 이유 중 하나다 -->
    <p class="auth-links" id="login-alt">
      <a href="find-email.html">이메일 찾기</a>
      <span class="sep">|</span>
      <a href="find-password.html">비밀번호 찾기</a>
      <span class="sep">|</span>
      <a href="signup.html">회원가입</a>
    </p>
  </section>

  <footer>
    <div class="footer-inner">
      <div class="footer-links">
        <a href="terms.html">이용약관</a>
        <a href="privacy.html">개인정보 처리방침</a>
        <a href="https://www.youtube.com/@소문의섬" target="_blank" rel="noopener">YouTube</a>
      </div>
      <div id="biz-info"></div>
      <p class="footer-meta"><span id="footer-copy"></span><span class="footer-email">coq3820@gmail.com</span></p>
    </div>
  </footer>


  <script src="footer.js?v=20260904e"></script>
  <script src="login-page.js?v=20260904e"></script>
  <script src="nav-auth.js?v=20260904e"></script>
  <script src="theme.js?v=20260904e"></script>
</body>
</html>
