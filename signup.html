          <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>

  <section class="auth auth-wide">
    <div class="auth-inner">
      <img src="/assets/icons/goditor.png" alt="" class="auth-mark" id="su-mark" width="52" height="52" hidden />
      <!-- ★눈꺼풀은 «비어 있는 채로» 시작한다. 전에는 아래 H1 과 «같은 문장»이라
           같은 말을 두 줄로 두 번 했다 — 제목이 이미 그 말을 한다.
           ★다만 지우지는 않았다. 앱에서 넘어오면(?app=goditor) 이 자리가
             「GODITOR 시작하기」로 바뀌어 «어디서 왔는지»를 말한다 — 그때는 중복이 아니다.
             그래서 «채울 말이 있을 때만» 나타나게 한다(아래 스크립트가 hidden 을 푼다). -->
      <p class="section-label" id="su-label" hidden></p>
      <h1 class="auth-title">회원가입</h1>

      <div class="auth-card">
      <form id="signup-form" class="signup-form" novalidate>
        <label class="signup-label" for="email">이메일</label>
        <!-- ★중복확인(현빈 2026-09-02). 왜 넣었나:
             이미 가입된 주소로 다시 가입하면 화면은 「가입 완료」라고 하는데 «새로 친 비밀번호는 버려진다»
             (signup.js 의 $setOnInsert — 계정 탈취를 막는 «옳은» 장치다). 그래서 사용자는
             «있지도 않은 비밀번호»로 로그인을 시도하다 갇힌다. 현빈이 직접 겪었다.
             ⇒ 가입 «전»에 알려준다. ★새 버튼 모양을 만들지 않는다 — 이미 있는 .field-row/.field-btn 을 쓴다. -->
        <div class="field-row">
          <input id="email" name="email" type="email" class="signup-input" placeholder="you@example.com"
                 autocomplete="email" required />
          <button type="button" class="field-btn" id="email-check">중복확인</button>
        </div>
        <p class="field-err" id="err-email" role="status" aria-live="polite"></p>

        <label class="signup-label" for="password">비밀번호 <span class="lbl-hint">(8자 이상)</span></label>
        <input id="password" name="password" type="password" class="signup-input" placeholder="••••••••"
               autocomplete="new-password" minlength="8" required />
        <p class="field-err" id="err-password" role="status" aria-live="polite"></p>

        <label class="signup-label" for="password2">비밀번호 확인</label>
        <input id="password2" name="password2" type="password" class="signup-input" placeholder="••••••••"
               autocomplete="new-password" minlength="8" required />
        <p class="field-err" id="err-password2" role="status" aria-live="polite"></p>

        <!-- ★★확장 수집 구간 — data/flags.json 의 extendedSignup 이 true 일 때만 «존재»한다.
             기본은 hidden 이고, 아래 스크립트가 잠겨 있으면 DOM 에서 «지운다».
             숨기기만 하면 안 된다 — 숨은 입력도 값이 실려 나가고, 사용자가 볼 수도 있다.

             ★왜 잠갔나: 개인정보 수집·이용 동의는 «고지사항»이 있어야 성립하는데
               data/legal.json 의 약관 본문이 아직 비어 있다(사업자정보 대기).
               빈 고지로 성함·전화번호를 받으면 안 된다.
             ★기본값이 «안전한 쪽»이다 — flags 를 못 읽어도(fetch 실패·구버전 캐시)
               구간은 지워진 채로 남는다. 열려면 명시적으로 true 여야 한다. -->
        <div id="ext-block" class="ext-block" hidden>
          <label class="signup-label" for="name">이름 <span class="req-mark">[필수]</span></label>
          <input id="name" name="name" type="text" class="signup-input" placeholder="홍길동"
                 autocomplete="name" maxlength="40" required />
          <p class="field-err" id="err-name" role="status" aria-live="polite"></p>

          <label class="signup-label" for="phone">휴대전화 <span class="req-mark">[필수]</span></label>
          <!-- ★문자 발송이 아직 없다. 「받기」 버튼을 두면 눌러도 아무 일이 없어
               «고장난 것»으로 보인다 — 그래서 버튼은 두지 않는다.
               (2026-09-02 독립검수 지적 / 안내문구는 현빈 지시로 삭제) -->
          <input id="phone" name="phone" type="tel" class="signup-input" placeholder="01012345678"
          autocomplete="tel" inputmode="numeric" maxlength="13" required />
          <p class="field-err" id="err-phone" role="status" aria-live="polite"></p>

          <div class="agree-box">
            <!-- ★checked 를 «마크업»에도 박는다(2026-09-02 라이브 실측).
                 아래 스크립트의 동기화(all.checked = kids.every(...))는 flags.json 을 받은 «뒤»에
                 돌기 때문에, 네트워크가 느리면 1~2초간 「자식 3개는 켜졌는데 전체 동의만 꺼진」
                 상태가 «보인다». 로컬에서는 응답이 즉시라 안 보였다 — 라이브에서만 드러났다.
                 ⚠️자식 기본값을 하나라도 «해제»로 바꾸면 이 checked 도 같이 떼라(스크립트가
                   결국 바로잡긴 하지만, 그 사이 «틀린 상태»가 보인다). -->
            <label class="agree-item agree-all">
              <input type="checkbox" id="agree-all" checked /> <span><b>전체 동의</b></span>
            </label>
            <div class="agree-divider"></div>

            <!-- ★★약관 동의와 개인정보 수집·이용 동의는 «따로» 받는다.
                 하나로 묶으면 개인정보 보호법 제22조① 의 «구분 동의» 요건을 못 채운다.
                 (2026-09-02 조사 B5) -->
            <label class="agree-item">
              <input type="checkbox" id="agree-terms" class="agree-child" checked />
              <span>[필수] <a href="terms.html" target="_blank" rel="noopener">이용약관</a> 동의</span>
            </label>

            <label class="agree-item">
              <input type="checkbox" id="agree-privacy" class="agree-child" checked />
              <span>[필수] <a href="privacy.html" target="_blank" rel="noopener">개인정보 수집·이용</a> 동의
                <br /><small class="agree-detail">
                  수집 항목: 이메일, 비밀번호, 이름, 휴대전화번호 ·
                  이용 목적: 회원 식별과 계정 보호, 아이디 찾기 ·
                  보유 기간: 탈퇴 또는 삭제 요청 시까지
                </small></span>
            </label>

            <!-- ★2026-09-02 현빈 지시로 «기본 체크»로 바꿨다(「[선택]도 다 되어 있게」).
                 ⚠️남는 위험을 적어 둔다: 정보통신망법 제50조①은 영리 목적 광고성 정보에
                   «명시적 사전 동의»를 요구해서, 미리 체크된 상태는 동의로 인정받지 못할 수 있다.
                   우리 개인정보 처리방침 제3조의 「철회해도 불이익 없습니다」와도 결이 다르다.
                 ⇒ 그래서 «사용자가 직접 해제하고 가입하려 할 때» 뜨는 재확인 창(askedMarketing)은
                   그대로 둔다 — 해제 의사가 «명시»로 남는 쪽이 사전 체크만 있는 것보다 낫다.
                 되돌리려면 checked 한 단어만 떼면 된다. -->
            <label class="agree-item">
              <input type="checkbox" id="agree-marketing" class="agree-child" checked />
              <span>[선택] 마케팅 정보 수신 동의
                <br /><small class="agree-detail">
                  신규 기능·이벤트 안내를 이메일로 보내 드립니다.
                  동의하지 않아도 가입과 서비스 이용에 아무런 제한이 없으며, 언제든 철회할 수 있습니다.
                </small></span>
            </label>
          </div>
          <p class="field-err" id="err-agree" role="status" aria-live="polite"></p>
        </div>

        <button type="submit" class="signup-submit" id="signup-submit">가입하기 →</button>
        <p class="signup-msg" id="signup-msg" role="status" aria-live="polite"></p>
      </form>
      </div>

      <!-- ★가입 축하 모달(현빈 2026-09-02). 전에는 「가입 완료!」 한 줄이 1.4초 뜨고
           «자동으로» 로그인 화면으로 넘어갔다 — 읽을 새도 없고, 무엇이 끝났는지 남지 않았다.
           ⇒ 사람이 «확인하고» 넘어간다.
           ★hidden 으로 감춘다 — 전역 [hidden]{display:none!important} 이 있어 확실히 숨는다.
             (이 프로젝트에서 el.hidden 이 flex 에 먹혀 안 숨은 사고가 있었다) -->
      <div class="modal-veil" id="welcome" hidden role="dialog" aria-modal="true" aria-labelledby="welcome-title">
        <div class="modal-card">
          <img src="/assets/logo-mark.png?v=20260904b" alt="" class="modal-mark" width="56" height="56" />
          <h2 class="modal-title" id="welcome-title">가입이 끝났어요!</h2>
          <p class="modal-sub" id="welcome-sub"></p>
          <p class="modal-email" id="welcome-email"></p>
          <a href="login.html" class="signup-submit modal-go" id="welcome-go">로그인하러 가기 →</a>
        </div>
      </div>

      <p class="auth-links">
        <a href="login.html">이미 계정이 있어요</a>
        <span class="sep">|</span>
        <a href="terms.html">이용약관</a>
        <span class="sep">|</span>
        <a href="privacy.html">개인정보 처리방침</a>
      </p>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <div class="footer-links">
        <a href="terms.html">이용약관</a>
        <a href="privacy.html">개인정보 처리방침</a>
        <a href="https://www.youtube.com/@소문의섬" target="_blank" rel="noopener">YouTube</a>
      </div>
      <div id="biz-info"></div>
      <p class="footer-meta"><span id="footer-copy"></span><span class="footer-email">coq3820@gmail.com</span></p>
    </div>
  </footer>

  <script>
    (function () {
      const form = document.getElementById('signup-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submit = document.getElementById('signup-submit');
      const msg = document.getElementById('signup-msg');
      // ★서버(api/_lib/util.js 의 EMAIL_RE)와 «같은 식»이다. 한쪽만 고치면 판정이 갈린다.
      //   옛 식은 'coq3820@gmail.comㄴㅇ' 을 통과시켰다(한글이 TLD 자리에 들어감).
      const emailRe = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*\.[A-Za-z]{2,63}$/;

      function show(text, ok) {
        msg.textContent = text;
        msg.className = 'signup-msg ' + (ok ? 'signup-msg-ok' : 'signup-msg-error');
      }

      // ★★경고는 «틀린 칸 바로 아래»에 띄운다(현빈 2026-09-02).
      //   전에는 전부 폼 맨 아래 한 줄(#signup-msg)로 갔다 — 제출 버튼 «아래»라,
      //   화면이 길면 경고가 보이지도 않고, 보여도 «어느 칸이» 틀렸는지 알 수 없었다.
      //   #signup-msg 는 이제 «서버 응답·전체 상태»만 맡는다.
      function fieldErr(id, text) {
        var el = document.getElementById('err-' + id);
        if (el) { el.textContent = text || ''; el.classList.toggle('is-on', !!text); }
      }
      function clearErrs() {
        ['email','password','password2','name','phone','agree'].forEach(function (k) { fieldErr(k, ''); });
      }
      // 칸을 고치면 그 칸 경고는 «즉시» 지운다 — 고쳤는데 빨간 글씨가 남아 있으면 거짓말이 된다.
      ['email','password','password2','name','phone'].forEach(function (k) {
        var el = document.getElementById(k);
        if (el) el.addEventListener('input', function () { fieldErr(k, ''); });
      });

      // ── 확장 수집 구간 열고 닫기 ────────────────────────────────
      // flags 를 읽기 전까지는 «잠긴 것으로» 취급한다. 못 읽으면 잠긴 채로 남는다.
      // 제출 버튼은 판정이 끝날 때까지 눌리지 않게 막는다 —
      // 그 틈에 제출되면 «열려 있는데 필드가 없는» 상태로 실패한다.
      var ext = document.getElementById('ext-block');
      var extOpen = false;
      submit.disabled = true;

      function lockExtended() { if (ext) { ext.remove(); ext = null; } extOpen = false; }
      function openExtended() {
        if (!ext) return;
        ext.hidden = false;
        extOpen = true;

        // 전체동의 ↔ 개별항목 동기화 (구간이 있을 때만 의미가 있다)
        var all = document.getElementById('agree-all');
        var kids = Array.prototype.slice.call(document.querySelectorAll('.agree-child'));
        all.addEventListener('change', function () {
          kids.forEach(function (k) { k.checked = all.checked; });
        });
        kids.forEach(function (k) {
          k.addEventListener('change', function () {
            all.checked = kids.every(function (x) { return x.checked; });
          });
        });
        // ★열자마자 «전체 동의»의 상태를 자식들과 맞춘다. 안 하면 필수 2개가 켜져 있는데
        //   전체 동의만 꺼져 보여, 사용자가 「내가 뭘 안 했나」 하고 헷갈린다.
        all.checked = kids.every(function (x) { return x.checked; });

        var phoneEl = document.getElementById('phone');
        phoneEl.addEventListener('input', function () {
          phoneEl.value = phoneEl.value.replace(/[^0-9]/g, '').slice(0, 11);
        });
      }

      // ★flags.json 은 응답에 Cache-Control 이 «없다» → 브라우저 휴리스틱 캐시가 걸린다.
      //   플래그를 뒤집어도 옛 값을 든 브라우저는 동의 구간이 «통째로 없는» 화면을 본다.
      fetch('data/flags.json?v=20260904b')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (f) { (f && f.extendedSignup === true) ? openExtended() : lockExtended(); })
        .catch(lockExtended)
        .then(function () { submit.disabled = false; });

      // ── 중복확인 ────────────────────────────────────────────────
      // ★«확인한 주소»를 기억한다. 확인 뒤 주소를 고치면 확인은 무효가 된다.
      var checkedEmail = null;   // 마지막으로 확인이 «끝난» 주소
      var emailTaken = false;
      var chkBtn = document.getElementById('email-check');
      emailInput.addEventListener('input', function () { checkedEmail = null; emailTaken = false; });

      chkBtn.addEventListener('click', async function () {
        var email = (emailInput.value || '').trim();
        if (!email || !emailRe.test(email)) {
          checkedEmail = null;
          return bad2('이메일 형식이 올바르지 않아요.', emailInput);
        }
        chkBtn.disabled = true;
        var label = chkBtn.textContent;
        chkBtn.textContent = '확인 중…';
        try {
          var r = await fetch('/api/license/check-email', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email }),
          });
          var d = await r.json().catch(function () { return {}; });
          if (r.status === 429) { checkedEmail = null; return bad2('확인 요청이 너무 잦아요. 잠시 후 다시 시도해 주세요.', null); }
          if (!r.ok || !d.ok)   { checkedEmail = null; return bad2('지금은 확인할 수 없어요. 잠시 후 다시 시도해 주세요.', null); }
          // ★★도메인이 메일을 못 받으면 «확인됨»으로 치지 않는다 — 그래야 제출에서도 막힌다.
          //   (서버 signup 도 한 번 더 막지만, 여기서 잡아야 사용자가 «다 채우기 전에» 안다)
          if (d.deliverable === false) {
            checkedEmail = null; emailTaken = false;
            return bad2('메일을 받을 수 없는 주소예요. 도메인을 다시 확인해 주세요.', emailInput);
          }
          checkedEmail = email;
          emailTaken = !!d.taken;
          if (emailTaken) {
            // ★★이 문장이 오늘 사고의 «해결»이다. 전에는 이미 가입된 주소로도 「가입 완료」가 떴다.
            fieldErr('email', '이미 가입된 이메일이에요. 로그인하거나 비밀번호 찾기를 이용해 주세요.');
            document.getElementById('err-email').classList.remove('is-ok');
          } else {
            fieldErr('email', '사용할 수 있는 이메일이에요.');
            document.getElementById('err-email').classList.add('is-ok');
          }
        } catch (e) {
          checkedEmail = null;
          bad2('네트워크가 불안정해요. 잠시 후 다시 시도해 주세요.', null);
        } finally {
          chkBtn.disabled = false;
          chkBtn.textContent = label;
        }
      });
      // 중복확인 «전용» 경고 — 제출 흐름의 bad() 와 달리 다른 칸 경고를 지우지 않는다.
      function bad2(text, el) {
        fieldErr('email', text);
        document.getElementById('err-email').classList.remove('is-ok');
        if (el) el.focus();
        return false;
      }

      // ── 가입 축하 모달 ──────────────────────────────────────────
      function openWelcome(email, ready, dest) {
        var veil = document.getElementById('welcome');
        document.getElementById('welcome-sub').textContent = ready
          ? '이제 바로 쓰실 수 있어요. 로그인해서 시작해 주세요.'
          : '가입하신 주소로 인증 메일을 보냈어요. 메일의 링크를 눌러 인증을 마쳐 주세요.';
        document.getElementById('welcome-email').textContent = email;
        var go = document.getElementById('welcome-go');
        go.setAttribute('href', dest);
        go.textContent = ready ? '로그인하러 가기 →' : '로그인 화면으로 →';
        veil.hidden = false;
        // ★뒤 화면이 «스크롤되지 않게» 막는다 — 모달 위에서 굴리면 뒤가 움직여 어지럽다.
        document.body.style.overflow = 'hidden';
        go.focus();
        // ⛔밖을 눌러 닫히게 하지 않는다. 여기서 닫으면 «가입이 취소된 걸로» 오해할 수 있고,
        //   폼은 이미 reset 된 뒤라 돌아갈 곳이 없다. 나갈 길은 버튼 하나다.
      }

      var askedMarketing = false;   // ★한 번 물으면 다시 묻지 않는다
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var email    = (emailInput.value || '').trim();
        var password = passwordInput.value || '';
        var pw2      = document.getElementById('password2').value || '';
        // ★확장 구간이 잠겨 있으면 이 요소들은 «존재하지 않는다». 읽지도 보내지도 않는다.
        var v = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
        var c = function (id) { var el = document.getElementById(id); return !!(el && el.checked); };
        var name     = (v('name') || '').trim();
        var phone    = (v('phone') || '').trim();
        var marketing= c('agree-marketing');

        // ★el 의 id 로 «그 칸의» 경고 자리를 찾는다. 맨 아래 한 줄은 비워 둔다.
        function bad(text, el, key) {
          clearErrs();
          fieldErr(key || (el && el.id) || 'agree', text);
          show('', true);
          if (el) { el.focus(); if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
          return false;
        }

        clearErrs();
        if (!email || !emailRe.test(email))  return bad('이메일 형식이 올바르지 않아요.', emailInput);
        // ★중복확인을 «안 했거나», 확인 뒤 주소를 «고쳤으면» 다시 시킨다.
        //   안 그러면 확인한 주소와 가입하는 주소가 달라져 확인이 무의미해진다.
        if (checkedEmail !== email)          return bad('중복확인을 눌러 주세요.', emailInput);
        if (emailTaken)                      return bad('이미 가입된 이메일이에요. 로그인하거나 비밀번호 찾기를 이용해 주세요.', emailInput);
        if (password.length < 8)             return bad('비밀번호는 8자 이상이어야 해요.', passwordInput);
        if (password !== pw2)                return bad('비밀번호가 서로 달라요.', document.getElementById('password2'));
        // ★★마케팅 미동의로 «그냥 지나치는» 사람에게 한 번 더 묻는다(현빈 2026-09-02).
        //   ⛔단, 「동의 안 하면 기능이 제한된다」고 «말하지 않는다». 두 가지 이유다:
        //     ① 사실이 아니다 — 마케팅 수신동의와 자동 업데이트는 기술적으로 무관하다.
        //        업데이트는 앱이 하고, 이건 «소식을 메일로 받을지»일 뿐이다.
        //     ② 우리 개인정보 처리방침 제3조가 스스로 「동의를 철회하셔도 서비스 이용에는
        //        아무런 불이익이 없습니다」라고 적어 뒀다. 여기서 반대로 말하면 자기모순이고,
        //        선택 동의를 거부했다고 불이익을 «고지»하는 것은 개인정보보호법 제22조⑤ 에 걸린다.
        //   ⇒ «사실만» 말하고 되묻는다. 목적(한 번 더 묻기)은 그대로 달성된다.
        //   ★문구 확정(현빈 2026-09-02): 「동의하지 않으시면 새 기능·버그 수정 소식을
        //     빠르게 받아보실 수 없을 수도 있습니다.」 — 이건 «사실»이라 써도 된다.
        //     동의하지 않으면 그 소식을 «메일로 못 받는» 것이 맞다. 기능이 막힌다는 주장이 아니다.
        //   ★그리고 「선택이며 불이익이 없다」는 법정 고지는 «체크박스 본문»에 그대로 있다
        //     ([선택] 표시 + .agree-detail). 확인창은 «되묻기»이지 고지가 아니므로,
        //     본문 고지가 살아 있는 한 여기서 설득 문구를 써도 요건은 충족된다.
        //     ⛔단 본문 고지를 지우면 이 문구가 «유일한 설명»이 되어 성격이 바뀐다 — 같이 지우지 마라.
        if (extOpen && !marketing && !askedMarketing) {
          askedMarketing = true;   // 한 번만 묻는다 — 두 번 물으면 강요가 된다
          submit.disabled = false;
          var goOn = window.confirm(
            '마케팅 정보 수신에 동의하지 않으셨어요.\n\n' +
            '동의하지 않으시면 새 기능·버그 수정 소식을 빠르게 받아보실 수 없을 수도 있습니다.\n\n' +
            '[확인] 동의하지 않고 계속 가입하기\n' +
            '[취소] 돌아가서 동의 체크하기'
          );
          if (!goOn) {
            var mk = document.getElementById('agree-marketing');
            if (mk) mk.focus();
            return false;
          }
        }

        if (extOpen) {
          if (!name)                         return bad('이름을 입력해 주세요.', document.getElementById('name'));
          if (phone.length < 10)             return bad('휴대전화 번호를 정확히 입력해 주세요.', document.getElementById('phone'));
          if (!c('agree-terms'))             return bad('이용약관에 동의해 주세요.', document.getElementById('agree-terms'), 'agree');
          // ★개인정보 수집·이용 동의는 «별도»다 — 약관 동의로 대신할 수 없다(개인정보 보호법 제22조①).
          if (!c('agree-privacy'))           return bad('개인정보 수집·이용에 동의해 주세요.', document.getElementById('agree-privacy'), 'agree');
        }

        submit.disabled = true;
        var original = submit.textContent;
        submit.textContent = '가입 중…';
        try {
          const r = await fetch('/api/license/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            // ★확장이 잠겨 있으면 profile·consents 자체를 «보내지 않는다».
            //   빈 객체라도 보내면 «받긴 받는데 비어 있다»가 되어 나중에 구분이 안 된다.
            //   (서버도 flags 를 보고 한 번 더 버린다 — 여기만 믿지 않는다)
            body: JSON.stringify(Object.assign(
              { email: email, password: password },
              extOpen ? {
                // ★개인정보는 profile 하나로 묶어 보낸다 — 나중에 지울 때 한 덩어리로 지운다
                profile: { name: name, phone: phone },
                consents: { terms: true, privacy: true, marketing: marketing },
              } : {}
            )),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok || !data.ok) {
            // ★서버 오류코드를 그대로 붙이면 「가입에 실패했어요: weak_password」가 뜬다.
            //   아는 건 번역하고, 모르는 건 «코드를 숨기고» 사람 말로 폴백한다.
            var ERRORS = {
              invalid_email:             '이메일 형식이 올바르지 않아요.',
              weak_password:             '비밀번호는 8자 이상이어야 해요.',
              terms_required:            '이용약관에 동의해 주세요.',
              privacy_consent_required:  '페이지를 새로고침한 뒤 개인정보 수집·이용에 동의해 주세요.',
              invalid_body:              '요청을 읽지 못했어요. 새로고침한 뒤 다시 시도해 주세요.',
              undeliverable_domain:      '메일을 받을 수 없는 주소예요. 도메인을 다시 확인해 주세요.',
              internal_error:            '서버 오류예요. 잠시 후 다시 시도해 주세요.'
            };
            show(ERRORS[data.error] || '가입에 실패했어요. 잠시 후 다시 시도해 주세요.', false);
            return;
          }
          try { sessionStorage.setItem('sms_email', email); } catch (e2) {}
          // ★alreadyVerified 분기를 뗐다. 서버가 그 값을 «더 이상 주지 않는다» —
          //   이미 가입된 이메일인지 알려주는 것 자체가 계정 열거 도구였다.
          //   그래서 화면 문구도 계정 유무와 «무관하게» 같아야 한다.
          //   이미 계정이 있던 사람은 로그인 화면에서 자기 비밀번호로 들어가면 되고,
          //   기억이 안 나면 그 화면의 «비밀번호 찾기»로 간다.
          show('', true);
          // ★`all` 은 확장 구간 안에 있다 — 잠겨 있으면 없다. form.reset() 이
          //   체크박스도 되돌리므로 별도 처리는 없어도 된다.
          form.reset();
          // ★어디로 보낼지는 그대로 계산한다 — 다만 «자동 이동»은 안 한다.
          var nx = new URLSearchParams(location.search).get('next');
          var ap = new URLSearchParams(location.search).get('app');
          var q  = [];
          if (nx) q.push('next=' + encodeURIComponent(nx));
          if (ap) q.push('app=' + encodeURIComponent(ap));
          var dest = 'login.html' + (q.length ? '?' + q.join('&') : '');
          openWelcome(email, !!data.ready, dest);
        } catch (err) {
          show('네트워크 오류로 가입에 실패했어요. 잠시 후 다시 시도해주세요.', false);
        } finally {
          submit.disabled = false;
          submit.textContent = original;
        }
      });
    })();
  </script>

  <script>
    // ★계정은 «소문의섬» 계정이지 특정 앱 계정이 아니다. 기본 문구는 플랫폼 것으로 둔다.
    //   다만 앱 페이지에서 넘어온 사람에게는 그 앱을 언급하는 편이 자연스러워서,
    //   링크에 ?app=<id> 가 실려 오면 그 앱 이름으로 바꿔준다. 없으면 플랫폼 문구 그대로.
    (function () {
      var app;
      try { app = new URLSearchParams(location.search).get('app'); } catch (e) { return; }
      if (!app) return;
      fetch('data/apps.json?v=20260904b').then(function (r) { return r.ok ? r.json() : null; })
        .then(function (apps) {
          if (!apps) return;
          var a = apps.filter(function (x) { return x.id === app; })[0];
          if (!a) return;
          window.__srcApp = a;
          var label = document.getElementById('su-label');
          var mark  = document.getElementById('su-mark');
          // 채울 말이 생겼을 때만 눈꺼풀을 꺼낸다(기본은 비어 있고 숨어 있다)
          if (label) { label.textContent = a.name + ' 시작하기'; label.hidden = false; }
          if (mark && a.icon) { mark.src = a.icon; mark.alt = a.name; mark.hidden = false; }
        }).catch(function () {});
    })();
  </script>
  <script src="footer.js?v=20260904b"></script>
  <script src="nav-auth.js?v=20260904b"></script>
  <script src="theme.js?v=20260904b"></script>
</body>
</html>
