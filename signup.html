<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0B0B0E" />
  <script>(function(){try{var t=localStorage.getItem('sms_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>회원가입 · 소문의섬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="style.css?v=20260902p" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">소문의섬</a>
      <div class="nav-links">
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
        <button type="button" class="theme-toggle" aria-label="테마 전환">
          <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
        </button>
      </div>
    </nav>
  </header>

  <section class="auth">
    <div class="auth-inner">
      <img src="/assets/icons/goditor.png" alt="" class="auth-mark" id="su-mark" width="52" height="52" hidden />
      <!-- ★눈꺼풀은 «비어 있는 채로» 시작한다. 전에는 아래 H1 과 «같은 문장»이라
           같은 말을 두 줄로 두 번 했다 — 제목이 이미 그 말을 한다.
           ★다만 지우지는 않았다. 앱에서 넘어오면(?app=goditor) 이 자리가
             「GODITOR 시작하기」로 바뀌어 «어디서 왔는지»를 말한다 — 그때는 중복이 아니다.
             그래서 «채울 말이 있을 때만» 나타나게 한다(아래 스크립트가 hidden 을 푼다). -->
      <p class="section-label" id="su-label" hidden></p>
      <h1 class="auth-title">회원가입</h1>

      <div class="auth-card">
      <form id="signup-form" class="signup-form" novalidate>
        <label class="signup-label" for="email">이메일</label>
        <input id="email" name="email" type="email" class="signup-input" placeholder="you@example.com"
               autocomplete="email" required />

        <label class="signup-label" for="password">비밀번호 <span class="lbl-hint">(8자 이상)</span></label>
        <input id="password" name="password" type="password" class="signup-input" placeholder="••••••••"
               autocomplete="new-password" minlength="8" required />

        <label class="signup-label" for="password2">비밀번호 확인</label>
        <input id="password2" name="password2" type="password" class="signup-input" placeholder="••••••••"
               autocomplete="new-password" minlength="8" required />

        <!-- ★★확장 수집 구간 — data/flags.json 의 extendedSignup 이 true 일 때만 «존재»한다.
             기본은 hidden 이고, 아래 스크립트가 잠겨 있으면 DOM 에서 «지운다».
             숨기기만 하면 안 된다 — 숨은 입력도 값이 실려 나가고, 사용자가 볼 수도 있다.

             ★왜 잠갔나: 개인정보 수집·이용 동의는 «고지사항»이 있어야 성립하는데
               data/legal.json 의 약관 본문이 아직 비어 있다(사업자정보 대기).
               빈 고지로 성함·전화번호를 받으면 안 된다.
             ★기본값이 «안전한 쪽»이다 — flags 를 못 읽어도(fetch 실패·구버전 캐시)
               구간은 지워진 채로 남는다. 열려면 명시적으로 true 여야 한다. -->
        <div id="ext-block" class="ext-block" hidden>
          <label class="signup-label" for="name">이름 <span class="req-mark">[필수]</span></label>
          <input id="name" name="name" type="text" class="signup-input" placeholder="홍길동"
                 autocomplete="name" maxlength="40" required />

          <label class="signup-label" for="phone">휴대전화 <span class="req-mark">[필수]</span></label>
          <!-- ★문자 발송이 아직 없다. 「받기」 버튼을 두면 눌러도 아무 일이 없어
               «고장난 것»으로 보인다 — 그래서 버튼은 두지 않는다.
               (2026-09-02 독립검수 지적 / 안내문구는 현빈 지시로 삭제) -->
          <input id="phone" name="phone" type="tel" class="signup-input" placeholder="01012345678"
          autocomplete="tel" inputmode="numeric" maxlength="13" required />
          <p class="signup-hint">
            이름과 휴대전화번호는 <b>아이디(이메일) 찾기</b>에 씁니다. 그 밖의 용도로는 쓰지 않습니다.
          </p>

          <div class="agree-box">
            <label class="agree-item agree-all">
              <input type="checkbox" id="agree-all" /> <span><b>전체 동의</b></span>
            </label>
            <div class="agree-divider"></div>

            <!-- ★★약관 동의와 개인정보 수집·이용 동의는 «따로» 받는다.
                 하나로 묶으면 개인정보 보호법 제22조① 의 «구분 동의» 요건을 못 채운다.
                 (2026-09-02 조사 B5) -->
            <label class="agree-item">
              <input type="checkbox" id="agree-terms" class="agree-child" />
              <span>[필수] <a href="terms.html" target="_blank" rel="noopener">이용약관</a> 동의</span>
            </label>

            <label class="agree-item">
              <input type="checkbox" id="agree-privacy" class="agree-child" />
              <span>[필수] <a href="privacy.html" target="_blank" rel="noopener">개인정보 수집·이용</a> 동의
                <br /><small class="agree-detail">
                  수집 항목: 이메일, 비밀번호, 이름, 휴대전화번호 ·
                  이용 목적: 회원 식별과 계정 보호, 아이디 찾기 ·
                  보유 기간: 탈퇴 또는 삭제 요청 시까지
                </small></span>
            </label>

            <label class="agree-item">
              <input type="checkbox" id="agree-marketing" class="agree-child" />
              <span>[선택] 마케팅 정보 수신 동의
                <br /><small class="agree-detail">
                  신규 기능·이벤트 안내를 이메일로 보내 드립니다.
                  동의하지 않아도 가입과 서비스 이용에 아무런 제한이 없으며, 언제든 철회할 수 있습니다.
                </small></span>
            </label>
          </div>
        </div>

        <button type="submit" class="signup-submit" id="signup-submit">가입하기 →</button>
        <p class="signup-msg" id="signup-msg" role="status" aria-live="polite"></p>
      </form>
      </div>

      <p class="auth-links">
        <a href="login.html">이미 계정이 있어요</a>
        <span class="sep">|</span>
        <a href="terms.html">이용약관</a>
        <span class="sep">|</span>
        <a href="privacy.html">개인정보 처리방침</a>
      </p>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <span>coq3820@gmail.com</span>
      <div class="footer-links">
        <a href="terms.html">이용약관</a>
        <a href="privacy.html">개인정보 처리방침</a>
        <a href="https://www.youtube.com/@소문의섬" target="_blank" rel="noopener">YouTube</a>
      </div>
    <div id="biz-info"></div>
    </div>
  </footer>

  <script>
    (function () {
      const form = document.getElementById('signup-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submit = document.getElementById('signup-submit');
      const msg = document.getElementById('signup-msg');
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function show(text, ok) {
        msg.textContent = text;
        msg.className = 'signup-msg ' + (ok ? 'signup-msg-ok' : 'signup-msg-error');
      }

      // ── 확장 수집 구간 열고 닫기 ────────────────────────────────
      // flags 를 읽기 전까지는 «잠긴 것으로» 취급한다. 못 읽으면 잠긴 채로 남는다.
      // 제출 버튼은 판정이 끝날 때까지 눌리지 않게 막는다 —
      // 그 틈에 제출되면 «열려 있는데 필드가 없는» 상태로 실패한다.
      var ext = document.getElementById('ext-block');
      var extOpen = false;
      submit.disabled = true;

      function lockExtended() { if (ext) { ext.remove(); ext = null; } extOpen = false; }
      function openExtended() {
        if (!ext) return;
        ext.hidden = false;
        extOpen = true;

        // 전체동의 ↔ 개별항목 동기화 (구간이 있을 때만 의미가 있다)
        var all = document.getElementById('agree-all');
        var kids = Array.prototype.slice.call(document.querySelectorAll('.agree-child'));
        all.addEventListener('change', function () {
          kids.forEach(function (k) { k.checked = all.checked; });
        });
        kids.forEach(function (k) {
          k.addEventListener('change', function () {
            all.checked = kids.every(function (x) { return x.checked; });
          });
        });

        var phoneEl = document.getElementById('phone');
        phoneEl.addEventListener('input', function () {
          phoneEl.value = phoneEl.value.replace(/[^0-9]/g, '').slice(0, 11);
        });
      }

      // ★flags.json 은 응답에 Cache-Control 이 «없다» → 브라우저 휴리스틱 캐시가 걸린다.
      //   플래그를 뒤집어도 옛 값을 든 브라우저는 동의 구간이 «통째로 없는» 화면을 본다.
      fetch('data/flags.json?v=20260902p')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (f) { (f && f.extendedSignup === true) ? openExtended() : lockExtended(); })
        .catch(lockExtended)
        .then(function () { submit.disabled = false; });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var email    = (emailInput.value || '').trim();
        var password = passwordInput.value || '';
        var pw2      = document.getElementById('password2').value || '';
        // ★확장 구간이 잠겨 있으면 이 요소들은 «존재하지 않는다». 읽지도 보내지도 않는다.
        var v = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
        var c = function (id) { var el = document.getElementById(id); return !!(el && el.checked); };
        var name     = (v('name') || '').trim();
        var phone    = (v('phone') || '').trim();
        var marketing= c('agree-marketing');

        function bad(msg, el) { show(msg, false); if (el) el.focus(); }

        if (!email || !emailRe.test(email))  return bad('이메일 형식이 올바르지 않아요.', emailInput);
        if (password.length < 8)             return bad('비밀번호는 8자 이상이어야 해요.', passwordInput);
        if (password !== pw2)                return bad('비밀번호가 서로 달라요.', document.getElementById('password2'));
        if (extOpen) {
          if (!name)                         return bad('이름을 입력해 주세요.', document.getElementById('name'));
          if (phone.length < 10)             return bad('휴대전화 번호를 정확히 입력해 주세요.', document.getElementById('phone'));
          if (!c('agree-terms'))             return bad('이용약관에 동의해 주세요.', document.getElementById('agree-terms'));
          // ★개인정보 수집·이용 동의는 «별도»다 — 약관 동의로 대신할 수 없다(개인정보 보호법 제22조①).
          if (!c('agree-privacy'))           return bad('개인정보 수집·이용에 동의해 주세요.', document.getElementById('agree-privacy'));
        }

        submit.disabled = true;
        var original = submit.textContent;
        submit.textContent = '가입 중…';
        try {
          const r = await fetch('/api/license/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            // ★확장이 잠겨 있으면 profile·consents 자체를 «보내지 않는다».
            //   빈 객체라도 보내면 «받긴 받는데 비어 있다»가 되어 나중에 구분이 안 된다.
            //   (서버도 flags 를 보고 한 번 더 버린다 — 여기만 믿지 않는다)
            body: JSON.stringify(Object.assign(
              { email: email, password: password },
              extOpen ? {
                // ★개인정보는 profile 하나로 묶어 보낸다 — 나중에 지울 때 한 덩어리로 지운다
                profile: { name: name, phone: phone },
                consents: { terms: true, privacy: true, marketing: marketing },
              } : {}
            )),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok || !data.ok) {
            // ★서버 오류코드를 그대로 붙이면 「가입에 실패했어요: weak_password」가 뜬다.
            //   아는 건 번역하고, 모르는 건 «코드를 숨기고» 사람 말로 폴백한다.
            var ERRORS = {
              invalid_email:             '이메일 형식이 올바르지 않아요.',
              weak_password:             '비밀번호는 8자 이상이어야 해요.',
              terms_required:            '이용약관에 동의해 주세요.',
              privacy_consent_required:  '페이지를 새로고침한 뒤 개인정보 수집·이용에 동의해 주세요.',
              invalid_body:              '요청을 읽지 못했어요. 새로고침한 뒤 다시 시도해 주세요.',
              internal_error:            '서버 오류예요. 잠시 후 다시 시도해 주세요.'
            };
            show(ERRORS[data.error] || '가입에 실패했어요. 잠시 후 다시 시도해 주세요.', false);
            return;
          }
          try { sessionStorage.setItem('sms_email', email); } catch (e2) {}
          // ★alreadyVerified 분기를 뗐다. 서버가 그 값을 «더 이상 주지 않는다» —
          //   이미 가입된 이메일인지 알려주는 것 자체가 계정 열거 도구였다.
          //   그래서 화면 문구도 계정 유무와 «무관하게» 같아야 한다.
          //   이미 계정이 있던 사람은 로그인 화면에서 자기 비밀번호로 들어가면 되고,
          //   기억이 안 나면 그 화면의 «비밀번호 찾기»로 간다.
          if (data.ready) {
            show('가입 완료! 바로 사용할 수 있어요. 로그인 화면으로 이동할게요…', true);
          } else {
            show('가입 완료! 인증 메일을 확인해주세요.', true);
          }
          // ★`all` 은 확장 구간 안에 있다 — 잠겨 있으면 없다. form.reset() 이
          //   체크박스도 되돌리므로 별도 처리는 없어도 된다.
          form.reset();
          if (data.ready) {
            var nx = new URLSearchParams(location.search).get('next');
            var ap = new URLSearchParams(location.search).get('app');
            var q  = [];
            if (nx) q.push('next=' + encodeURIComponent(nx));
            if (ap) q.push('app=' + encodeURIComponent(ap));
            var dest = 'login.html' + (q.length ? '?' + q.join('&') : '');
            setTimeout(function () { window.location.href = dest; }, 1400);
          }
        } catch (err) {
          show('네트워크 오류로 가입에 실패했어요. 잠시 후 다시 시도해주세요.', false);
        } finally {
          submit.disabled = false;
          submit.textContent = original;
        }
      });
    })();
  </script>

  <script>
    // ★계정은 «소문의섬» 계정이지 특정 앱 계정이 아니다. 기본 문구는 플랫폼 것으로 둔다.
    //   다만 앱 페이지에서 넘어온 사람에게는 그 앱을 언급하는 편이 자연스러워서,
    //   링크에 ?app=<id> 가 실려 오면 그 앱 이름으로 바꿔준다. 없으면 플랫폼 문구 그대로.
    (function () {
      var app;
      try { app = new URLSearchParams(location.search).get('app'); } catch (e) { return; }
      if (!app) return;
      fetch('data/apps.json').then(function (r) { return r.ok ? r.json() : null; })
        .then(function (apps) {
          if (!apps) return;
          var a = apps.filter(function (x) { return x.id === app; })[0];
          if (!a) return;
          window.__srcApp = a;
          var label = document.getElementById('su-label');
          var mark  = document.getElementById('su-mark');
          // 채울 말이 생겼을 때만 눈꺼풀을 꺼낸다(기본은 비어 있고 숨어 있다)
          if (label) { label.textContent = a.name + ' 시작하기'; label.hidden = false; }
          if (mark && a.icon) { mark.src = a.icon; mark.alt = a.name; mark.hidden = false; }
        }).catch(function () {});
    })();
  </script>
  <script src="footer.js?v=20260902p"></script>
  <script src="theme.js?v=20260902p"></script>
</body>
</html>
