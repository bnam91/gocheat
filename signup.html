<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0B0B0E" />
  <title>회원가입 · 소문의섬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">소문의섬</a>
      <div class="nav-links">
        <a href="/#apps">앱</a>
        <a href="/pricing.html">요금제</a>
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
      </div>
    </nav>
  </header>

  <section class="signup">
    <div class="signup-inner">
      <img src="/public/icons/goditor.png" alt="GODITOR" class="brand-mark" width="48" height="48" />
      <p class="section-label">GODITOR 계정 만들기</p>
      <h1 class="signup-title">도구 출시·강의 오픈·실전 노하우. 가장 먼저 받으실 수 있게.</h1>
      <p class="signup-sub">
        이벤트 기간에는 가입 즉시 GODITOR 전체 기능을 쓸 수 있어요.
        도구·콘텐츠 소식만 가끔 보내드리고, 광고는 보내지 않아요.
      </p>

      <form id="signup-form" class="signup-form" novalidate>
        <label class="signup-label" for="email">이메일</label>
        <input
          id="email"
          name="email"
          type="email"
          class="signup-input"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
        <label class="signup-label" for="password">비밀번호 <span style="opacity:.5;font-weight:400;">(8자 이상)</span></label>
        <input
          id="password"
          name="password"
          type="password"
          class="signup-input"
          placeholder="••••••••"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <button type="submit" class="signup-submit" id="signup-submit">가입하기 →</button>
        <p class="signup-msg" id="signup-msg" role="status" aria-live="polite"></p>
      </form>

      <p class="signup-fineprint">
        ※ 이벤트 기간에는 이메일 인증 없이 가입 즉시 이용할 수 있어요.<br />
        이미 계정이 있다면 <a href="login.html" style="color:var(--accent);font-weight:600;">로그인</a>해 주세요.
      </p>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <span>비밀이라 부르기엔 아까운 기술들 © 소문의섬<br />coq3820@gmail.com</span>
      <div class="footer-links">
        <a href="https://www.youtube.com/@소문의섬" target="_blank" rel="noopener">YouTube</a>
        <a href="https://github.com/bnam91" target="_blank" rel="noopener">GitHub</a>
      </div>
    <div id="biz-info"></div>
    </div>
  </footer>

  <script>
    (function () {
      const form = document.getElementById('signup-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submit = document.getElementById('signup-submit');
      const msg = document.getElementById('signup-msg');
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function show(text, ok) {
        msg.textContent = text;
        msg.className = 'signup-msg ' + (ok ? 'signup-msg-ok' : 'signup-msg-error');
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = (emailInput.value || '').trim();
        const password = passwordInput.value || '';
        if (!email || !emailRe.test(email)) {
          show('이메일 형식이 올바르지 않아요.', false); emailInput.focus(); return;
        }
        if (password.length < 8) {
          show('비밀번호는 8자 이상이어야 해요.', false); passwordInput.focus(); return;
        }

        submit.disabled = true;
        const original = submit.textContent;
        submit.textContent = '가입 중…';
        try {
          const r = await fetch('/api/license/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok || !data.ok) {
            const reason = data.error || ('HTTP ' + r.status);
            show('가입에 실패했어요: ' + reason, false);
            return;
          }
          // 가입한 이메일은 로그인 화면에서 채워 쓴다 (비밀번호는 저장하지 않는다)
          try { sessionStorage.setItem('goditor_email', email); } catch (e2) {}

          if (data.alreadyVerified) {
            show('이미 가입된 계정이에요. 로그인 화면으로 이동할게요…', true);
          } else if (data.ready) {
            show('가입 완료! 바로 사용할 수 있어요. 로그인 화면으로 이동할게요…', true);
          } else {
            show('가입 완료! 인증 메일을 확인해주세요.', true);
          }
          form.reset();
          if (data.alreadyVerified || data.ready) {
            var nx = new URLSearchParams(location.search).get('next');
            var dest = 'login.html' + (nx ? '?next=' + encodeURIComponent(nx) : '');
            setTimeout(function () { window.location.href = dest; }, 1400);
          }
        } catch (err) {
          show('네트워크 오류로 가입에 실패했어요. 잠시 후 다시 시도해주세요.', false);
        } finally {
          submit.disabled = false;
          submit.textContent = original;
        }
      });
    })();
  </script>
  <script src="footer.js"></script>
</body>
</html>
