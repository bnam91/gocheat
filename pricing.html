<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0B0B0E" />
  <script>(function(){try{var t=localStorage.getItem('sms_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>요금제 · 소문의섬</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20260904e" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=20260904e" />
  <!--
    ★이 페이지는 «상품 고르는» 페이지다.

    구조: 라라스토어(소문의섬) → 상품(앱) → 옵션(등급).
    옵션은 상품에 딸린 것이므로 실제 요금제 카드는 각 앱 상세 페이지 안에 있다.
    그래서 여기서는 «어느 앱의 요금제를 볼지»만 고른다.
      - 요금제가 있는 앱이 하나면  → 바로 그 앱으로 넘긴다(지금: GODITOR)
      - 둘 이상이면(고비디오 등)  → 목록을 보여준다
    apps.json 의 plans 유무로 판단하므로 앱이 늘어도 이 파일은 그대로다.

    ★이 주소를 없애면 안 된다:
      api/license/login.js 의 PURCHASE_URL 기본값이 '/pricing.html' 이고,
      만료된 사용자의 앱 "요금제 보기" 버튼이 이 주소로 온다.
      살려두면 Vercel 환경변수를 건드릴 필요가 없다.
  -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="style.css?v=20260904e" />
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo"><img class="logo-mark" src="/assets/logo-mark.png?v=20260904e" alt="" width="22" height="22" /><span>소문의섬</span></a>
      <div class="nav-links">
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
        <button type="button" class="theme-toggle" aria-label="테마 전환">
          <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
        </button>
      </div>
    </nav>
  </header>

  <section class="signup">
    <div class="signup-inner">
      <p class="section-label">요금제</p>
      <h1 class="signup-title">어떤 앱의 요금제를 보실까요?</h1>
      <p class="signup-sub">
        요금제는 앱마다 따로 있어요. 앱을 고르면 그 앱의 등급 안내로 이동합니다.
      </p>
      <div id="app-list" class="pricing-apps">
        <p class="dim">불러오는 중…</p>
      </div>
      <p class="signup-fineprint">
        지금은 <b>베타테스트 기간</b>이라 가입만 하면 전 기능을 무료로 쓰실 수 있어요.
      </p>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <div class="footer-links">
        <a href="terms.html">이용약관</a>
        <a href="privacy.html">개인정보 처리방침</a>
        <a href="https://www.youtube.com/@소문의섬" target="_blank" rel="noopener">YouTube</a>
      </div>
      <div id="biz-info"></div>
      <p class="footer-meta"><span id="footer-copy"></span><span class="footer-email">coq3820@gmail.com</span></p>
    </div>
  </footer>

  <script>
    (function () {
      var box = document.getElementById('app-list');
      function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

      fetch('data/apps.json?v=20260904e')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (apps) {
          if (!apps) throw new Error('apps.json');
          var withPlans = apps.filter(function (a) { return a.plans && a.plans.length && a.detailUrl; });

          if (!withPlans.length) {
            box.innerHTML = '<p class="dim">아직 요금제가 공개된 앱이 없어요.</p>';
            return;
          }
          // 하나뿐이면 고르게 할 이유가 없다 — 바로 넘긴다
          if (withPlans.length === 1) {
            location.replace(withPlans[0].detailUrl + '#pricing');
            return;
          }
          box.innerHTML = withPlans.map(function (a) {
            return '<a class="app-card" href="' + esc(a.detailUrl) + '#pricing">'
              + '<div class="app-icon">' + (a.icon ? '<img src="' + esc(a.icon) + '" alt="' + esc(a.name) + '" />' : '📦') + '</div>'
              + '<div class="app-info"><div class="app-name">' + esc(a.name) + '</div>'
              + '<div class="app-tagline">' + esc(a.tagline || '') + '</div>'
              + '<div class="app-footer"><span class="app-badge">요금제 보기</span>'
              + '<span class="app-arrow">→</span></div></div></a>';
          }).join('');
        })
        .catch(function () {
          box.innerHTML = '<p class="dim">'
            + '요금제 목록을 불러오지 못했어요. '
            + '<a href="/goditor.html#pricing" style="color:var(--accent)">GODITOR 요금제 보기 →</a></p>';
        });
    })();
  </script>
  <script src="footer.js?v=20260904e"></script>
  <script src="nav-auth.js?v=20260904e"></script>
  <script src="theme.js?v=20260904e"></script>
</body>
</html>
