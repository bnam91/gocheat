<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0B0B0E" />
  <title>요금제 · 소문의섬</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
  <!--
    ★이 페이지는 «넘겨주는» 페이지다.

    소문의섬은 플랫폼이고 요금제는 «앱별»이다. 앱이 늘면 pricing.html 하나로는
    감당이 안 되므로, 실제 요금제는 각 앱 상세 페이지 안에 둔다
    (지금은 GODITOR 하나 → /goditor.html#pricing).

    그런데 이 주소를 없애면 안 된다:
      api/license/login.js 의 PURCHASE_URL 기본값이 '/pricing.html' 이고,
      만료된 사용자의 앱 화면 "요금제 보기" 버튼이 이 주소로 온다.
    지워버리면 그 버튼이 404 가 된다. 그래서 «살려두고 넘긴다» —
    이러면 Vercel 환경변수(PURCHASE_URL)를 건드릴 필요가 없다.
  -->
  <link rel="canonical" href="/goditor.html#pricing" />
  <meta http-equiv="refresh" content="0; url=/goditor.html#pricing" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="signup">
    <div class="signup-inner">
      <img src="/public/icons/goditor.png" alt="GODITOR" class="brand-mark" width="48" height="48" />
      <p class="section-label">GODITOR 요금제</p>
      <h1 class="signup-title">요금제 페이지로 이동합니다.</h1>
      <p class="signup-sub">
        요금제는 앱마다 따로 있어요. GODITOR 요금제는 앱 소개 페이지 안에 있습니다.<br />
        자동으로 넘어가지 않으면 아래를 눌러주세요.
      </p>
      <a href="/goditor.html#pricing" class="cta-primary">GODITOR 요금제 보기 →</a>
    </div>
  </section>

  <script>
    // meta refresh 가 막힌 환경 대비. replace 라 뒤로가기 때 이 페이지에 갇히지 않는다.
    window.location.replace('/goditor.html#pricing');
  </script>
</body>
</html>
