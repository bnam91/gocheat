  <section class="hero">
    <div class="hero-inner">
      <!-- ★아이브로(.hero-badge) 다시 걷어냄 (현빈 2026-09-05: 「아이브로우는 없애도 될듯」).
           2026-09-05 낮에 「드디어 공개합니다.」로 되살렸다가 몇 시간 만에 도로 뺀다.
           ★뺀 이유(추정) — 제목이 「소문내지 마세요 / 애초에 다수를 위한 곳이 아닙니다」로
             «태도와 이유»를 다 말하게 되면서 라벨이 할 일이 없어졌다. 제목이 이름만 말할 때
             (「역전 야매 치트키」) 필요했던 자리다.
           ★style.css 의 .hero padding-top 을 80px → 126px 로 «되돌렸다».
             그 주석의 규칙 그대로다: 라벨이 있으면 80, 없으면 126(=80+라벨 46).
           ★되살릴 땐 아래 한 줄만 풀고 padding 을 다시 80px 로.
      <p class="hero-badge">드디어 공개합니다.</p>
      -->
      <h1 class="hero-title">
        <!-- 메인 카피 (현빈 2026-09-05, 3차). ★현빈이 직접 쓴 문장을 그대로 쓴다.
             이전: 「소문내지 마세요. / 여기는 다수를 위한 곳이 아닙니다.」(2026-09-02, 2차)
             그 전: 「여기, 당신이 찾던 / 비밀이 있습니다.」 · 그 전: 「Coming Soon」

             ★왜 바꿨나 — 2차 카피는 두 줄이 «둘 다 배타성»만 말했다. 유튜브에서 고디터를 보고
               들어온 사람에게는 «여기가 뭐 하는 곳인지»가 안 잡혔고, 서브카피가 「상세페이지」로
               좁혀 있어 「아, 디자인툴 회사구나」로 닫혔다(2026-09-05 카피 과잉생산에서 확인).
             ★「저점매수」한 단어가 두 가지를 동시에 한다 — ①지금은 싸다 ②앞으로 오른다.
               브랜드를 «종목»으로 취급해 「지금 잡아둬야겠다」를 만든다.
             ★「역전 야매 치트키」는 고야앤드미디어 내부팀 이름이다(정본 표기는 붙임
               「역전야매치트키」). 여기서는 «카피»라 읽기 쉬운 띄어쓰기 판을 쓴다 — 현빈 원안 그대로.
             ★2차 주석에 있던 설계 원칙은 그대로 유효하다: 강조(그라디언트)는 «짧고 브랜드를
               되받는 첫 줄»이 먹는다. 여기서도 첫 줄이 팀 이름이라 그 원칙이 유지된다.

             ★★최종 배치(현빈 2026-09-05, 저녁 3차): 「애초에…」를 «제목으로 올렸다».
               라벨 = 드디어 공개합니다.(사건)
               제목 = 소문내지 마세요. / 애초에 다수를 위한 곳이 아닙니다.(태도 + 이유)
               서브 = ⚠️더미(아래 참고)
               ★제목이 두 줄로 «태도와 이유»를 다 말한다. 서브는 그래서 지금 비어 있는 자리다.
             ★둘째 줄은 데스크톱에서 «2줄로 접힌다»(18자). 제목 전체가 3줄이 된다 —
               2026-09-02 판(「여기는 다수를 위한 곳이 아닙니다.」)도 같은 모양이었으니 허용된 형태다.
               ⇒ 그래서 글자 크기를 80 → 64px 로 내렸다(style.css 참고). 3줄이 화면을 다 먹지 않게.
             ★띄어쓰기 — 「소문내지 마세요」. 보조용언 '마세요'는 띄는 것이 원칙이다.
               ⚠️현빈 지시는 「소문내지마세요」로 붙어 있었으나, 2026-09-02 이 자리에 남긴
                 띄어쓰기 원칙을 그대로 따른다(같은 문장을 그때도 띄어 썼다). -->
        <span class="title-line title-line-1 gradient-text">소문내지 마세요.</span>
        <span class="title-line title-line-2">애초에 다수를 위한 곳이 아닙니다.</span>
      </h1>
      <!-- ⚠️⚠️서브카피 — «더미»다. 확정 문구가 아니다 (현빈 2026-09-05: 「서브카피도 일단 더미로만」).
           「애초에 다수를 위한 곳이 아닙니다.」가 제목으로 올라가면서 이 자리가 비었다.
           ★자리를 «비워두지 않고» 더미를 넣는 이유 — 비우면 제목과 CTA 사이 리듬이 달라져서
             확정 문구를 넣었을 때의 모양을 미리 볼 수 없다. 글자 수가 비슷한 것으로 채운다.
           ★한 문장으로 둔다 — 두 줄이 되면 제목·서브카피·앱 칩 셋이 서로 경쟁한다(2026-09-03 원칙).
           ⛔이 문장 그대로 배포하지 말 것. 확정 전까지는 더미다. -->
      <p class="hero-sub">온라인으로 버는 사람들의 도구와 기록.</p>
      <!-- ★히어로 CTA 되살림 (현빈 2026-09-05). 2026-09-03 에 숨겼던 것을 다시 켠다.
           그때 뺀 이유와 지금 판단:
             ⑴「버튼 둘이 나란히 있으면 «오지 말라» 해놓고 «눌러달라» 하는 꼴이라 톤이 부딪힌다」
               → 라벨이 「드디어 공개합니다.」로 바뀌어 «공개»가 먼저 선다. 갈 곳이 하나 있는 게 맞다.
             ⑵「두 버튼이 «같은 검정»이라 우선순위도 없었다」
               → ★버튼을 «하나만» 켠다. 우선순위 문제가 원천적으로 사라진다.
           ★오픈카톡은 «켜지 않는다» — 우측 하단 플로팅(.kko-float)에 이미 있다. 여기 또 두면
             같은 링크가 한 화면에 둘이 된다. 2026-09-03 에 플로팅으로 옮긴 판단은 그대로 유효하다.
             (되살릴 일이 생기면 아래 주석의 a 태그를 hero-cta 안으로 옮기면 된다.) -->
      <!-- ★CTA 두 개 (현빈 2026-09-05: 「유튜브 버튼 왼쪽에 지금 저점매수하러가기」).
           왼쪽 = 「지금 저점매수하러가기 →」 · 오른쪽 = 「소문의섬 유튜브 →」
           ⚠️왼쪽 버튼의 링크를 signup.html 로 걸었다 — «저점매수 = 지금 들어와 두기»로 읽어
             가입을 목적지로 봤다. 요금제(goditor.html#pricing)나 다른 곳이면 href 만 바꾸면 된다.
           ⚠️★두 버튼은 지금 «시각적으로 똑같다». .cta-primary.is-quiet 이 primary 와 같은
             채움이기 때문이다(현빈 2026-09-02 「각각 검정으로 흰글씨로」). 그 CSS 주석에
             「둘을 구분하고 싶어지면 여기만 손대면 된다」고 조건부로 적혀 있어 임의로 바꾸지 않았다.
             2026-09-03 에 CTA 를 뺀 이유 중 하나가 「두 버튼이 같은 검정이라 우선순위도 없었다」였다.
             ⇒ 우선순위를 가를지는 현빈 결정 사항이다. -->
      <div class="hero-cta">
        <a href="signup.html" class="cta-primary">지금 저점매수하러가기 →</a>
        <a href="https://www.youtube.com/@소문의섬" target="_blank" rel="noopener" class="cta-primary is-quiet">소문의섬 유튜브 →</a>
      </div>
      <!-- 보존: 오픈카톡 버튼(지금은 우측 하단 플로팅 .kko-float 로 대체)
        <a href="https://open.kakao.com/o/gm2omOLi" target="_blank" rel="noopener" class="cta-primary is-quiet">오픈카톡방 →</a>
      -->
      <div class="hero-apps" id="hero-apps"></div>
    </div>

  <!-- ★프로덕트 섹션 임시 숨김 (현빈 2026-09-01). 되살리려면 주석만 풀면 된다.

  <!-- ★오픈카톡 플로팅 (현빈 2026-09-03) — «메인에만» 둔다.
