      <!-- ★아이브로(.hero-badge) 다시 걷어냄 (현빈 2026-09-05: 「아이브로우는 없애도 될듯」).
           2026-09-05 낮에 「드디어 공개합니다.」로 되살렸다가 몇 시간 만에 도로 뺀다.
           ★뺀 이유(추정) — 제목이 「소문내지 마세요 / 애초에 다수를 위한 곳이 아닙니다」로
             «태도와 이유»를 다 말하게 되면서 라벨이 할 일이 없어졌다. 제목이 이름만 말할 때

      <p class="hero-badge">드디어 공개합니다.</p>
      -->
      <h1 class="hero-title">
        <!-- 메인 카피 (현빈 2026-09-05, 3차). ★현빈이 직접 쓴 문장을 그대로 쓴다.
             이전: 「소문내지 마세요. / 여기는 다수를 위한 곳이 아닙니다.」(2026-09-02, 2차)
             그 전: 「여기, 당신이 찾던 / 비밀이 있습니다.」 · 그 전: 「Coming Soon」

             ★왜 바꿨나 — 2차 카피는 두 줄이 «둘 다 배타성»만 말했다. 유튜브에서 고디터를 보고
               들어온 사람에게는 «여기가 뭐 하는 곳인지»가 안 잡혔고, 서브카피가 「상세페이지」로
               좁혀 있어 「아, 디자인툴 회사구나」로 닫혔다(2026-09-05 카피 과잉생산에서 확인).
             ★「저점매수」한 단어가 두 가지를 동시에 한다 — ①지금은 싸다 ②앞으로 오른다.
               브랜드를 «종목»으로 취급해 「지금 잡아둬야겠다」를 만든다.
             ★「역전 야매 치트키」는 고야앤드미디어 내부팀 이름이다(정본 표기는 붙임
               「역전야매치트키」). 여기서는 «카피»라 읽기 쉬운 띄어쓰기 판을 쓴다 — 현빈 원안 그대로.
             ★2차 주석에 있던 설계 원칙은 그대로 유효하다: 강조(그라디언트)는 «짧고 브랜드를
               되받는 첫 줄»이 먹는다. 여기서도 첫 줄이 팀 이름이라 그 원칙이 유지된다.

             ★★최종 배치(현빈 2026-09-05, 저녁 3차): 「애초에…」를 «제목으로 올렸다».
               라벨 = 드디어 공개합니다.(사건)
               제목 = 소문내지 마세요. / 애초에 모두를 위한 제품이 아닙니다.(태도 + 이유)
               ⚠️2026-09-05 저녁 「다수를」 → 「모두를」(현빈). 「다수」는 «많은 쪽»을 재는 말이라
                 세는 느낌이 남는다. 「모두」는 «전부»라 배제가 더 분명하고 말맛도 자연스럽다.
               서브 = ⚠️더미(아래 참고)
               ★제목이 두 줄로 «태도와 이유»를 다 말한다. 서브는 그래서 지금 비어 있는 자리다.
             ★둘째 줄은 데스크톱에서 «2줄로 접힌다»(18자). 제목 전체가 3줄이 된다 —
               2026-09-02 판(「여기는 다수를 위한 곳이 아닙니다.」)도 같은 모양이었으니 허용된 형태다.
               ⇒ 그래서 글자 크기를 80 → 64px 로 내렸다(style.css 참고). 3줄이 화면을 다 먹지 않게.
             ★★2026-09-05 저녁 — 「쉿!」을 붙였다(현빈). 첫 줄이 «태도»에서 «행동»이 된다 —
               조용히 하라고 «지금 말하는» 소리라 문장이 살아난다.
             ★띄어쓰기 — 「소문내지 마세요」. 보조용언 '마세요'는 띄는 것이 원칙이다.
               ⚠️현빈 지시는 「소문내지마세요」로 붙어 있었으나, 2026-09-02 이 자리에 남긴
                 띄어쓰기 원칙을 그대로 따른다(같은 문장을 그때도 띄어 썼다). -->
        <span class="title-line title-line-1">소문내지 마세요.</span>
        <span class="title-line title-line-2">애초에 모두를 위한</span>
        <span class="title-line title-line-3">제품이 아닙니다.</span>
      </h1>
      <!-- ★서브카피 «숨김» (현빈 2026-09-05: 「이건 없어도 될듯 숨겨줘」).
           더미로 채워 두었던 자리다. 제목이 「소문내지 마세요 / 애초에 다수를 위한 곳이 아닙니다」로
           «태도와 이유»를 다 말하므로 서브가 더 보탤 말이 없었다.
           ★지우지 않고 주석으로 남긴다 — 이 파일의 관례다(아이브로·오픈카톡 버튼도 같은 방식).
             되살릴 땐 아래 한 줄만 풀면 된다.
           ★간격은 «저절로 유지된다» — 2026-09-01 에 「부제를 걷으면 그 여백까지 같이 사라진다」는
             문제를 겪고 .hero-cta 가 margin-top:72px 을 «스스로» 갖게 해 뒀다(style.css 주석).
             그래서 서브를 빼도 제목과 CTA 사이가 무너지지 않는다.
      <p class="hero-sub">온라인으로 버는 사람들의 도구와 기록.</p>
      -->
      <!-- ★히어로 CTA 되살림 (현빈 2026-09-05). 2026-09-03 에 숨겼던 것을 다시 켠다.
           그때 뺀 이유와 지금 판단:
             ⑴「버튼 둘이 나란히 있으면 «오지 말라» 해놓고 «눌러달라» 하는 꼴이라 톤이 부딪힌다」
               → 라벨이 「드디어 공개합니다.」로 바뀌어 «공개»가 먼저 선다. 갈 곳이 하나 있는 게 맞다.
             ⑵「두 버튼이 «같은 검정»이라 우선순위도 없었다」
               → ★버튼을 «하나만» 켠다. 우선순위 문제가 원천적으로 사라진다.
           ★오픈카톡은 «켜지 않는다» — 우측 하단 플로팅(.kko-float)에 이미 있다. 여기 또 두면
             같은 링크가 한 화면에 둘이 된다. 2026-09-03 에 플로팅으로 옮긴 판단은 그대로 유효하다.
             (되살릴 일이 생기면 아래 주석의 a 태그를 hero-cta 안으로 옮기면 된다.) -->
      <!-- ★CTA — D′안 확정 (현빈 2026-09-05 저녁): «글자 하나 + 버튼 하나».
           왼쪽 = 「지금 저점매수 하러가기 →」 (.cta-lead — 채움 없는 글자)
           오른쪽 = 「소문의섬 유튜브」 (.cta-primary — 채움 버튼, ★화살표 없음)

           ★왜 이 조합인가
             ⑴ 눌러야 할 곳이 «하나»가 된다. 「소문내지 마세요 / 애초에 다수를 위한 곳이 아닙니다」로
                물러서는 톤에 버튼이 둘 나란히 있으면 «오지 말라 해놓고 두 군데나 눌러달라»가 된다.
             ⑵ ★2026-09-03 에 CTA 를 뺀 이유 두 가지가 «둘 다» 사라진다 —
                「톤이 부딪힌다」는 ⑴로, 「두 버튼이 같은 검정이라 우선순위도 없다」는
                애초에 채움이 하나뿐이라 성립하지 않는다.
             ⑶ ★그래서 .cta-primary.is-quiet 을 «손대지 않아도 된다».
                2026-09-02 「각각 검정으로 흰글씨로」 지시를 뒤집지 않는다.
           ★화살표는 «표시가 필요한 쪽에만» 준다 — 버튼은 이미 눌러 보이므로 없어도 되고,
             글자 링크는 그 표시가 있어야 «눌러도 되는 줄» 안다.
           ★.cta-secondary 는 style.css 에 이미 있었다(색·hover·focus 전부). HTML 어디서도
             안 쓰이던 스타일이라 새로 만들 게 없었다 — 예전에 쓰다 걷힌 자리다.
           ⚠️왼쪽 링크는 signup.html 이다 — «저점매수 = 지금 들어와 두기»로 읽어 가입을 목적지로 봤다.
             ★아직 확정이 아니다. 요금제(goditor.html#pricing) 등으로 바꾸려면 href 만 고치면 된다. -->
      <div class="hero-cta">
        <!-- ★링크가 아니다. 오른쪽 「유튜브 구독하기」를 «가리키는» 안내 문구다.
             (현빈 2026-09-05: 「지금 저점매수하기는 호버될 필요가 없지 않겠니?」)
             ⇒ 그래서 목적지를 정할 필요가 없어졌다. 앞서 임시로 걸어 뒀던 signup.html 은 뗐다.
             ★띄어쓰기 — 「지금 / 저점매수 / 하러가기」로 끊는다(현빈 2026-09-05 지정).
               «저점매수»를 한 덩어리로 세워 눈에 걸리게 하는 배치다.
               ⚠️어문 규범만 보면 '가다'가 본용언이라 「하러 가기」로 띄는 것이 원칙이다
                 (「소문내지 마세요」를 띄운 것과 같은 이유). 여기서는 «읽는 덩어리»를 우선해
                 현빈 지정대로 붙여 쓴다 — 규범을 몰라서가 아니라 «골라서» 그렇게 둔 것이다. -->
        <span class="cta-lead">지금 저점매수 하러가기 →</span>
        <!-- ★유튜브 «구독» 링크 (현빈 2026-09-05: 「구독하기 버튼 느낌이면 좋겠는데」).
             ?sub_confirmation=1 을 붙이면 유튜브가 «구독 확인 팝업»을 띄운다 — 유튜브가 공식으로
             지원하는 파라미터다. 채널 페이지만 여는 것보다 한 걸음 덜 걷는다.
             ★채널 «핸들»(@소문의섬)이 아니라 «채널 ID»로 건다 — 핸들도 대개 동작하지만
               ID 가 정식 경로다(채널 페이지 canonical 이 이 주소다). 핸들은 바뀔 수 있고 ID 는 안 바뀐다.
               UCz8sbGVvqpJTVcNR659ch5Q = 「소문의섬」 (2026-09-05 채널 HTML 의 canonical 로 확인).
             ⚠️구독 팝업은 «유튜브에 로그인돼 있을 때»만 뜬다. 비로그인이면 채널 페이지가 열리고
               로그인 후 팝업이 이어진다 — 어느 쪽이든 막다른 길은 아니다. -->
        <a href="https://www.youtube.com/channel/UCz8sbGVvqpJTVcNR659ch5Q?sub_confirmation=1"
           target="_blank" rel="noopener" class="cta-go">유튜브 구독하기</a>
      </div>
      <!-- 보존: 오픈카톡 버튼(지금은 우측 하단 플로팅 .kko-float 로 대체)
