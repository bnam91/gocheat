  <section class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">
        <!-- 메인 카피 (현빈 2026-09-02, 2차).
             이전: 「여기, 당신이 찾던 / 비밀이 있습니다.」 · 그 전: 「Coming Soon」
             ★브랜드 이름과 맞물린다 — 소문의섬 ↔ 「소문내지 마세요」. 그리고 현빈의 한정판 전략
               (인원 제한·「많은 사람을 받지 않는다」)을 첫 줄에서 그대로 말한다.
             ★강조(그라디언트)를 «첫 줄»로 옮겼다: 짧고 브랜드를 되받는 줄이 강조를 먹어야 한다.
               긴 설명 줄에 그라디언트를 걸면 문장이 흐려진다.
             ★띄어쓰기 — 「소문내지 마세요」. 보조용언 '마세요'는 띄는 것이 원칙이다.
             ★띄어쓰기만 손댔다 — 「소문내지 마세요」. 보조용언 '마세요'는 띄는 것이 원칙이다. -->
        <span class="title-line title-line-1 gradient-text">소문내지 마세요.</span>
        <span class="title-line title-line-2">여기는 다수를 위한 곳이 아닙니다.</span>
      </h1>
      <!-- ★히어로 CTA 임시 숨김 (현빈 2026-09-03). 되살리려면 주석만 풀면 된다.
           왜 뺐나: ⑴「다수를 위한 곳이 아닙니다」 바로 밑에 큰 버튼 둘이 나란히 있으면
             «오지 말라» 해놓고 «눌러달라» 하는 꼴이라 톤이 부딪힌다.
             ⑵두 버튼이 «같은 검정»이라 우선순위도 없었다.
           ★유튜브는 잃지 않는다 — 푸터에 13페이지 전부 링크가 있다(여기가 중복이었다).
           ★오픈카톡은 사이트 통틀어 이 버튼 하나뿐이라, 우측 하단 «플로팅»으로 옮긴다
             (아래 .kko-float). 첫 화면에만 있던 것이 어느 위치에서도 닿게 되어 오히려 낫다.
      <div class="hero-cta">
        <a href="https://www.youtube.com/@소문의섬" target="_blank" rel="noopener" class="cta-primary">소문의섬 유튜브 →</a>
        <a href="https://open.kakao.com/o/gm2omOLi" target="_blank" rel="noopener" class="cta-primary is-quiet">오픈카톡방 →</a>
      </div>
      -->
      <div class="hero-apps" id="hero-apps"></div>
    </div>
  </section>

  <main id="apps">
