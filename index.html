  <section class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">
        <!-- 메인 카피 (현빈 2026-09-05, 3차). ★현빈이 직접 쓴 문장을 그대로 쓴다.
             이전: 「소문내지 마세요. / 여기는 다수를 위한 곳이 아닙니다.」(2026-09-02, 2차)
             그 전: 「여기, 당신이 찾던 / 비밀이 있습니다.」 · 그 전: 「Coming Soon」

             ★왜 바꿨나 — 2차 카피는 두 줄이 «둘 다 배타성»만 말했다. 유튜브에서 고디터를 보고
               들어온 사람에게는 «여기가 뭐 하는 곳인지»가 안 잡혔고, 서브카피가 「상세페이지」로
               좁혀 있어 「아, 디자인툴 회사구나」로 닫혔다(2026-09-05 카피 과잉생산에서 확인).
             ★「저점매수」한 단어가 두 가지를 동시에 한다 — ①지금은 싸다 ②앞으로 오른다.
               브랜드를 «종목»으로 취급해 「지금 잡아둬야겠다」를 만든다.
             ★「역전 야매 치트키」는 고야앤드미디어 내부팀 이름이다(정본 표기는 붙임
               「역전야매치트키」). 여기서는 «카피»라 읽기 쉬운 띄어쓰기 판을 쓴다 — 현빈 원안 그대로.
             ★2차 주석에 있던 설계 원칙은 그대로 유효하다: 강조(그라디언트)는 «짧고 브랜드를
               되받는 첫 줄»이 먹는다. 여기서도 첫 줄이 팀 이름이라 그 원칙이 유지된다. -->
        <span class="title-line title-line-1 gradient-text">역전 야매 치트키</span>
        <span class="title-line title-line-2">지금 저점매수하세요.</span>
      </h1>
      <!-- ★★서브카피 — «임시»다(현빈 2026-09-03: 「일단 임시로 넣어서 진행」).
           ⚠️제목 둘째 줄을 고르는 중이라, 정해지면 이 줄과 «겹치는지» 다시 봐야 한다.
             (예: 둘째 줄이 「잘 만드는 사람들의 도구.」가 되면 이 줄과 같은 말이 된다)
           ★왜 넣었나 — 제목 두 줄이 «둘 다 배타성»만 말한다. 히어로 CTA 도 숨긴 뒤라
             처음 온 사람은 «여기가 뭐 하는 곳인지» 알 길이 없었다. 그 구멍만 막는다.
           ★그래서 «무엇을 파는지»만 말한다. 태도는 이미 제목이 하고 있다.
           ★한 문장으로 둔다 — 두 줄이 되면 제목·서브카피·앱 칩 셋이 서로 경쟁한다. -->
      <p class="hero-sub">상세페이지를 만들고 파는 사람들의 도구를 만듭니다.</p>
      <!-- ★히어로 CTA 임시 숨김 (현빈 2026-09-03). 되살리려면 주석만 풀면 된다.
           왜 뺐나: ⑴「다수를 위한 곳이 아닙니다」 바로 밑에 큰 버튼 둘이 나란히 있으면
             «오지 말라» 해놓고 «눌러달라» 하는 꼴이라 톤이 부딪힌다.
             ⑵두 버튼이 «같은 검정»이라 우선순위도 없었다.
           ★유튜브는 잃지 않는다 — 푸터에 13페이지 전부 링크가 있다(여기가 중복이었다).
           ★오픈카톡은 사이트 통틀어 이 버튼 하나뿐이라, 우측 하단 «플로팅»으로 옮긴다
             (아래 .kko-float). 첫 화면에만 있던 것이 어느 위치에서도 닿게 되어 오히려 낫다.
      <div class="hero-cta">
        <a href="https://www.youtube.com/@소문의섬" target="_blank" rel="noopener" class="cta-primary">소문의섬 유튜브 →</a>
        <a href="https://open.kakao.com/o/gm2omOLi" target="_blank" rel="noopener" class="cta-primary is-quiet">오픈카톡방 →</a>
      </div>
      -->
      <div class="hero-apps" id="hero-apps"></div>
    </div>
  </section>

  <!-- ★프로덕트 섹션 임시 숨김 (현빈 2026-09-01). 되살리려면 주석만 풀면 된다.

  <main id="apps">
